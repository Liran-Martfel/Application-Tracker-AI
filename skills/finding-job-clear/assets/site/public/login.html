<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>כניסה — האזור הפרטי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* slate and copper, always light: the doorway from the public page looks like it */
:root { --bg:#eceae8; --bg-2:#f6f5f4; --navy:#2b3445; --navy-deep:#1f2633; --accent:#2b3445; --accent-soft:rgba(43,52,69,.08); --gold:#a5694b; --gold-ink:#8a5238; --text-muted:#5d6470; --danger:#a23a43;
  --glass-bg:rgba(255,255,255,.6); --glass-border:rgba(255,255,255,.9); --glass-shadow:0 12px 40px rgba(43,52,69,.12); --glass-blur:blur(26px) saturate(160%); color-scheme: light;
  --radius-lg:22px; --radius-md:14px; --ease-out:cubic-bezier(.22,1,.36,1); --font:'Poppins','Assistant',system-ui,sans-serif; --font-he:'Assistant','Poppins',system-ui,sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--navy); font: 400 1rem/1.55 var(--font-he); }
body::before { content:''; position:fixed; inset:0; z-index:0; pointer-events:none; background: linear-gradient(180deg, var(--bg-2), var(--bg) 70%); }
.card { position: relative; z-index: 1; width: min(400px, 100%); padding: 26px 22px; border-radius: var(--radius-lg); background: var(--glass-bg); border: 1px solid var(--glass-border);
  backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); box-shadow: var(--glass-shadow), inset 0 1px 1px rgba(255,255,255,.4); animation: rise 320ms var(--ease-out) both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
.ico { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); margin: 0 auto 12px; }
h1 { margin: 0; text-align: center; font: 700 1.6rem/1.2 var(--font); background: linear-gradient(90deg, var(--navy-deep), var(--accent), var(--gold-ink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
p { margin: 6px 0 18px; text-align: center; color: var(--text-muted); font-size: .95rem; }
label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 6px; }
input { width: 100%; min-height: 48px; padding: 0 14px; border-radius: var(--radius-md); border: 1px solid #8a8f98; background: var(--bg-2); color: var(--navy); font: 400 1rem var(--font); direction: ltr; }
button { width: 100%; min-height: 48px; margin-top: 14px; border: 0; border-radius: var(--radius-md); color: #fff; font: 600 1rem var(--font-he); cursor: pointer;
  background: linear-gradient(90deg, #3d4a61, #2b3445); box-shadow: 0 8px 20px rgba(43,52,69,.24); transition: transform 100ms ease-out; touch-action: manipulation; }
button:active { transform: scale(.97); } button:disabled { opacity: .6; }
:is(input, button, a):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.err { margin-top: 12px; padding: 10px 12px; border-radius: var(--radius-md); background: rgba(162,58,67,.12); color: var(--navy); font-size: .9rem; }
.remember { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-weight: 500; font-size: .92rem; cursor: pointer; }
.remember input { width: 20px; height: 20px; min-height: 0; margin: 0; accent-color: var(--accent); }
.back { display: block; margin-top: 14px; text-align: center; color: var(--text-muted); font-size: .9rem; text-decoration: none; }
@media (prefers-reduced-motion: reduce) { .card { animation: none } button:active { transform: none } }
@media (prefers-reduced-transparency: reduce) { .card { background: var(--bg-2); backdrop-filter: none; -webkit-backdrop-filter: none } }
</style>
</head>
<body>
<form class="card" id="f">
  <div class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
  <h1>האזור הפרטי</h1>
  <p>מעקב ההגשות והסטטיסטיקה של {{FIRST_NAME_HE}}</p>
  <label for="pw">סיסמה</label>
  <input id="pw" type="password" autocomplete="current-password" required autofocus>
  <label class="remember" for="remember"><input id="remember" type="checkbox"> זכור אותי במכשיר הזה ל-30 יום</label>
  <button type="submit" id="go">כניסה</button>
  <div class="err" id="err" role="alert" hidden></div>
  <a class="back" href="/">חזרה לאתר</a>
</form>
<script src="/js/login-1.js"></script>
</body>
</html>
