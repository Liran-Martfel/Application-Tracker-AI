
<!-- ===== Job Feed: updates collected by a Google Apps Script every hour (no Claude usage) ===== -->
<style>
.jt-feed .jt-feed-list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.jt-feed .jt-feed-list li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--glass-strong, var(--color-bg)); border: 1px solid var(--hair, var(--color-border-line)); }
.jt-feed .jt-feed-kind { font-size: .78rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; white-space: nowrap; background: var(--accent-soft); color: var(--accent); }
.jt-feed .k-bad { background: color-mix(in srgb, var(--color-bad) 14%, transparent); color: var(--color-bad); }
.jt-feed .k-good { background: color-mix(in srgb, var(--color-ok) 16%, transparent); color: var(--color-ok); }
.jt-feed .k-warn { background: var(--gold-soft); color: var(--gold-ink); }
.jt-feed .jt-feed-main { min-width: 0; }
.jt-feed .jt-feed-main b { display: block; overflow-wrap: anywhere; }
.jt-feed .jt-feed-main small { color: var(--color-fg-muted); overflow-wrap: anywhere; }
.jt-feed .jt-feed-new { font-size: .72rem; font-weight: 700; color: var(--gold-ink); white-space: nowrap; }
.jt-feed .jt-feed-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
.jt-feed h3 { margin: 16px 0 8px; font-size: 1rem; }
.jt-feed a { color: var(--accent); text-decoration-color: color-mix(in srgb, var(--accent) 35%, transparent); }
@media (max-width: 520px) { .jt-feed .jt-feed-list li { grid-template-columns: minmax(0, 1fr); } }
</style>
<script>
(() => {
  const SHEET = '{{SHEET_ID}}';
  const SERVER = 'Google Sheets';
  const el = (t, a = {}, ...k) => { const e = document.createElement(t); for (const [x, v] of Object.entries(a)) { if (x === 'class') e.className = v; else if (x === 'text') e.textContent = v; else e.setAttribute(x, v); } k.flat().forEach((c) => c != null && e.append(c)); return e; };
  const card = el('section', { class: 'jt-card jt-feed', id: 'feed', 'aria-label': 'עדכונים אוטומטיים מ-Gmail' });
  const status = el('span', { class: 'jt-note', text: 'טוען את העדכונים האוטומטיים…' });
  const mailsBox = el('div'), jobsBox = el('div');
  card.append(el('div', { class: 'jt-feed-head' }, el('h2', { class: 'jt-h', text: 'עדכונים אוטומטיים מ-Gmail' }), status),
    el('p', { class: 'jt-note', text: 'נאסף כל שעה על ידי סקריפט ב-Google, בלי Claude. מסומן "חדש" מה שעוד לא נכנס לדשבורד — Claude יכניס אותו בסריקה הבאה.' }), mailsBox, jobsBox);
  const anchor = document.querySelector('.jt section.jt-replies-card') || document.querySelector('.jt-cv') || document.querySelector('.jt-head');
  (anchor && anchor.parentNode ? anchor.parentNode.insertBefore(card, anchor) : document.querySelector('.jt')?.append(card));

  const KIND_CLASS = { 'דחייה': 'k-bad', 'הצעה': 'k-good', 'ראיון': 'k-good', 'מטלה': 'k-warn', 'נצפה': 'k-warn' };
  let mails = null, jobs = null, last = null, err = null;
  const norm = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9א-ת]/g, '');
  function rowsOf(payload) {
    const v = payload?.values || [];
    if (!v.length) return [];
    const [h, ...r] = v; return r.map((x) => Object.fromEntries(h.map((k, i) => [k, x[i] ?? ''])));
  }
  function render() {
    if (err) { status.textContent = err; return; }
    if (!mails && !jobs) return;
    status.textContent = last ? 'עודכן לאחרונה ' + last : '';
    const evs = (window.dash?.data('events').data) || [];
    const threads = new Set(evs.map((e) => e.thread_id).filter(Boolean));
    const recent = (mails || []).filter((m) => m.kind !== 'אחר').sort((a, b) => b.date.localeCompare(a.date)).slice(0, 12);
    mailsBox.replaceChildren();
    if (recent.length) {
      const ul = el('ul', { class: 'jt-feed-list' });
      recent.forEach((m) => {
        const isNew = !threads.has(m.thread_id);
        const link = el('a', { href: m.link, target: '_blank', rel: 'noopener', text: m.subject || '(בלי נושא)' });
        ul.append(el('li', {}, el('span', { class: 'jt-feed-kind ' + (KIND_CLASS[m.kind] || ''), text: m.kind }),
          el('div', { class: 'jt-feed-main' }, el('b', {}, link), el('small', { text: [m.company, m.date, m.direction === 'יוצא' ? 'נשלח ממך' : ''].filter(Boolean).join(' · ') })),
          isNew ? el('span', { class: 'jt-feed-new', text: 'חדש' }) : el('span')));
      });
      mailsBox.append(el('h3', { text: 'מיילים אחרונים על ההגשות' }), ul);
    } else mailsBox.append(el('p', { class: 'jt-note', text: 'אין מיילים חדשים על ההגשות בימים האחרונים.' }));
    const have = new Set(((window.dash?.data('job_leads').data) || []).map((l) => norm(l.company) + '|' + norm(l.role)));
    const apps = new Set(((window.dash?.data('applications').data) || []).map((a) => norm(a.company) + '|' + norm(a.role)));
    const fresh = (jobs || []).filter((j) => j.fit !== 'אולי' && !have.has(norm(j.company) + '|' + norm(j.title)) && !apps.has(norm(j.company) + '|' + norm(j.title)))
      .sort((a, b) => (a.fit === 'מתאים מאוד' ? 0 : 1) - (b.fit === 'מתאים מאוד' ? 0 : 1) || b.seen.localeCompare(a.seen)).slice(0, 10);
    jobsBox.replaceChildren();
    if (fresh.length) {
      const ul = el('ul', { class: 'jt-feed-list' });
      fresh.forEach((j) => ul.append(el('li', {}, el('span', { class: 'jt-feed-kind ' + (j.fit === 'מתאים מאוד' ? 'k-good' : ''), text: j.fit }),
        el('div', { class: 'jt-feed-main' }, el('b', {}, el('a', { href: j.link, target: '_blank', rel: 'noopener', text: j.title })), el('small', { text: [j.company, j.location, j.seen].filter(Boolean).join(' · ') })),
        el('span', { class: 'jt-feed-new', text: 'משרה חדשה' }))));
      jobsBox.append(el('h3', { text: 'משרות חדשות מההתראות (לפני בדיקה של Claude)' }), ul);
    }
  }
  (async () => {
    const mcp = await window.claude?.use?.('mcp');
    if (!mcp) { err = 'העדכונים האוטומטיים זמינים כשהדשבורד פתוח ב-claude.ai.'; render(); return; }
    const watch = (range, cb) => mcp.watchTool(SERVER, 'get_values', { spreadsheetId: SHEET, range }, (ev) => {
      if (ev.type === 'data') { cb(ev.result?.payload ?? ev.result); render(); }
      else { const c = ev.error?.code; err = (c === 'server_not_connected' || c === 'needs_reauth' || c === 'not_granted' || c === 'consent_required') ? 'צריך לאשר גישה ל-Google Sheets כדי לראות את העדכונים האוטומטיים.' : 'עוד אין עדכונים אוטומטיים — הסקריפט ב-Google עדיין לא הופעל.'; render(); }
    }, { refetchInterval: 15 * 60 * 1000, cache: { staleTime: 5 * 60 * 1000 } });
    try {
      watch("'מיילים'!A1:I600", (p) => { mails = rowsOf(p); err = null; });
      watch("'משרות'!A1:H400", (p) => { jobs = rowsOf(p); });
      watch("'סטטוס'!A1:D2", (p) => { const r = rowsOf(p)[0]; last = r ? r.last_run : null; });
    } catch (e) { err = 'לא הצלחתי לקרוא את העדכונים האוטומטיים.'; render(); }
    window.dash?.onData(render);
  })();
})();
</script>
